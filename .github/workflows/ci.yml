name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.idea/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version-file: '.sdkmanrc'
          distribution: 'temurin'

      - name: Restore Maven repository
        id: maven-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ github.ref_name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ github.ref_name }}-
            ${{ runner.os }}-maven-main-
            ${{ runner.os }}-maven-

      - name: mvn verify
        run: mvn -B verify --batch-mode  --no-transfer-progress

      - name: Save Maven repository
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: datawallet-jar
          path: target/datawallet-*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  flutter:
    name: Flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore pub packages
        id: pub-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.pub-cache
            client/.dart_tool
          key: ${{ runner.os }}-pub-${{ github.ref_name }}-${{ hashFiles('client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ github.ref_name }}-
            ${{ runner.os }}-pub-main-
            ${{ runner.os }}-pub-

      - name: flutter pub get
        working-directory: client
        run: flutter pub get

      - name: flutter test
        working-directory: client
        run: flutter test

      - name: Save pub packages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.pub-cache
            client/.dart_tool
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

  bats:
    name: BATS end-to-end
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: '.sdkmanrc'

      - name: Restore Maven repository
        id: maven-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ github.ref_name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ github.ref_name }}-
            ${{ runner.os }}-maven-main-
            ${{ runner.os }}-maven-

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: datawallet-jar
          path: target/

      - name: Restore bats helper libraries
        id: cache-bats
        uses: actions/cache/restore@v5
        with:
          path: /usr/local/lib/bats
          key: ${{ runner.os }}-bats-libs-v1
          restore-keys: |
            ${{ runner.os }}-bats-libs-

      - name: Install bats and helper libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          if [ ! -d /usr/local/lib/bats/bats-support ]; then
            sudo mkdir -p /usr/local/lib/bats
            sudo git clone --depth 1 https://github.com/bats-core/bats-support.git /usr/local/lib/bats/bats-support
            sudo git clone --depth 1 https://github.com/bats-core/bats-assert.git  /usr/local/lib/bats/bats-assert
            sudo git clone --depth 1 https://github.com/bats-core/bats-file.git    /usr/local/lib/bats/bats-file
          fi

      - name: Run BATS suite
        run: bash bin/start-e2e.sh

      - name: Upload BATS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-logs
          path: target/batstest/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Maven repository
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

      - name: Save bats helper libraries
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: /usr/local/lib/bats
          key: ${{ steps.cache-bats.outputs.cache-primary-key }}
