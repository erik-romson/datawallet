name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.idea/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version-file: '.sdkmanrc'
          distribution: 'temurin'
          cache: maven

      - name: mvn verify
        run: mvn -B verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: datawallet-jar
          path: target/datawallet-*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  flutter:
    name: Flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: client
        run: flutter pub get

      - name: flutter test
        working-directory: client
        run: flutter test

  bats:
    name: BATS end-to-end
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: datawallet-jar
          path: target/

      - name: Install bats and helper libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          sudo mkdir -p /usr/local/lib/bats
          sudo git clone --depth 1 https://github.com/bats-core/bats-support.git /usr/local/lib/bats/bats-support
          sudo git clone --depth 1 https://github.com/bats-core/bats-assert.git  /usr/local/lib/bats/bats-assert
          sudo git clone --depth 1 https://github.com/bats-core/bats-file.git    /usr/local/lib/bats/bats-file

      - name: Run BATS suite
        run: bash bin/start-bats.sh

      - name: Upload BATS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-logs
          path: target/batstest/logs/
          if-no-files-found: ignore
          retention-days: 7
