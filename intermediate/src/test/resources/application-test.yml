management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

datawallet:
  intermediate:
    server-url: http://localhost:19999
    signer:
      seed-hex: "0102030405060708091011121314151617181920212223242526272829303132"
    attestation:
      mode: stub
    denylist:
      refresh-interval-seconds: 60
      max-staleness-seconds: 600
