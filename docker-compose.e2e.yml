services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_USER: wallet_admin
      POSTGRES_PASSWORD: adminpw
      POSTGRES_DB: datawallet
    volumes:
      - ./bin/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./bin/pg_isready_wrapper.sh:/usr/local/bin/pg_isready
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_admin -d datawallet"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    build:
      context: .
      target: server
    image: datawallet-server:e2e
    depends_on:
      pg:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mobile,it
      SPRING_DATASOURCE_URL: jdbc:postgresql://pg:5432/datawallet
      SPRING_DATASOURCE_USERNAME: wallet_app
      SPRING_DATASOURCE_PASSWORD: devpw
      DATAWALLET_SECURITY_ADMIN_MTLS: "false"
      DATAWALLET_SECURITY_ISSUER_MTLS: "false"
      DATAWALLET_SECURITY_ISSUER_BEARER_ENABLED: "true"
    ports: ["8443:8443"]

  intermediate:
    build:
      context: .
      target: intermediate
    image: datawallet-intermediate:e2e
    depends_on:
      server:
        condition: service_started
    environment:
      DATAWALLET_SERVER_URL: http://server:8443
      INTERMEDIATE_SIGNER_MODE: soft
      INTERMEDIATE_SIGNER_SEED_HEX: ${INTERMEDIATE_SIGNER_SEED_HEX}
    ports: ["8444:8444"]
